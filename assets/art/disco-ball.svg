<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 154" role="img" aria-label="Three-dimensional mirrored disco globe">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".42" stop-color="#d8d9e6"/>
      <stop offset="1" stop-color="#77758e"/>
    </linearGradient>
    <radialGradient id="sphere" cx="30%" cy="22%" r="82%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".18" stop-color="#e8f5fb"/>
      <stop offset=".48" stop-color="#aeb9cb"/>
      <stop offset=".76" stop-color="#68758e"/>
      <stop offset="1" stop-color="#283249"/>
    </radialGradient>
    <radialGradient id="rimShade" cx="34%" cy="26%" r="78%">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".62" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#121a2d" stop-opacity=".8"/>
    </radialGradient>
    <radialGradient id="pinkReflection" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#ffb6d5" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffb6d5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueReflection" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#a8e7f5" stop-opacity=".72"/>
      <stop offset="1" stop-color="#a8e7f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mirrorTiles" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#abb4c7"/>
      <rect x=".7" y=".7" width="6" height="5.8" fill="#fff" fill-opacity=".82"/>
      <rect x="7.4" y=".7" width="5.9" height="5.8" fill="#8490aa" fill-opacity=".8"/>
      <rect x=".7" y="7.5" width="6" height="5.8" fill="#c9d9e5" fill-opacity=".92"/>
      <rect x="7.4" y="7.5" width="5.9" height="5.8" fill="#697790" fill-opacity=".78"/>
      <path d="M0 7H14M7 0V14" fill="none" stroke="#f9fbff" stroke-opacity=".72" stroke-width=".7"/>
      <path d="M0 0H14V14H0Z" fill="none" stroke="#39445c" stroke-opacity=".42" stroke-width=".8"/>
    </pattern>
    <clipPath id="globeClip"><circle cx="60" cy="81" r="52"/></clipPath>
    <filter id="globeShadow" x="-30%" y="-25%" width="160%" height="175%">
      <feDropShadow dx="1" dy="5" stdDeviation="4" flood-color="#583d6c" flood-opacity=".28"/>
    </filter>
  </defs>

  <ellipse cx="61" cy="141" rx="35" ry="6" fill="#735675" opacity=".16"/>
  <path d="M60 3V20" fill="none" stroke="#9a91a9" stroke-width="2" stroke-linecap="round"/>
  <path d="M54 17Q60 14 66 17L68 27H52Z" fill="url(#metal)" stroke="#77758e" stroke-width="1"/>
  <rect x="51" y="25" width="18" height="7" rx="3.5" fill="#bbb9c9" stroke="#77758e" stroke-width="1"/>

  <g filter="url(#globeShadow)">
    <circle cx="60" cy="81" r="52" fill="url(#sphere)"/>
    <g clip-path="url(#globeClip)">
      <rect x="7" y="28" width="106" height="106" fill="url(#mirrorTiles)"/>
      <ellipse cx="42" cy="63" rx="32" ry="27" fill="url(#pinkReflection)"/>
      <ellipse cx="82" cy="103" rx="34" ry="29" fill="url(#blueReflection)"/>
      <g fill="none" stroke-linecap="round">
        <g stroke="#28344a" stroke-opacity=".48" stroke-width="1.5">
          <path d="M9 62Q60 48 111 62M8 80Q60 69 112 80M10 99Q60 111 110 99"/>
          <path d="M60 29C34 53 34 109 60 133M60 29C86 53 86 109 60 133M60 29C19 54 19 108 60 133M60 29C101 54 101 108 60 133"/>
        </g>
        <g stroke="#fff" stroke-opacity=".62" stroke-width=".75">
          <path d="M9 60Q60 46 111 60M8 78Q60 67 112 78M10 97Q60 109 110 97"/>
          <path d="M60 29C34 53 34 109 60 133M60 29C86 53 86 109 60 133M60 29C19 54 19 108 60 133M60 29C101 54 101 108 60 133"/>
        </g>
      </g>
      <circle cx="60" cy="81" r="52" fill="url(#rimShade)"/>
      <path d="M35 38C24 47 18 59 17 72" fill="none" stroke="url(#glint)" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="40" cy="43" rx="8" ry="4" fill="#fff" opacity=".72" transform="rotate(-38 40 43)"/>
      <path d="M76 119Q92 111 101 95" fill="none" stroke="#182238" stroke-opacity=".34" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle cx="60" cy="81" r="52" fill="none" stroke="#eef2fa" stroke-opacity=".86" stroke-width="1.4"/>
    <circle cx="60" cy="81" r="50.4" fill="none" stroke="#343e57" stroke-opacity=".55" stroke-width="1"/>
  </g>

  <path d="M22 42l1.4 4.1 4.1 1.4-4.1 1.4-1.4 4.1-1.4-4.1-4.1-1.4 4.1-1.4z" fill="#fff"/>
  <path d="M104 109l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#fff" opacity=".9"/>
</svg>
